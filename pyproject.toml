[project]
name = "novastack-orders"
version = "1.3.0"
description = "NovaStack's ordering service: menu, baskets, pricing, loyalty and checkout."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "NovaStack Orders Team" }]
dependencies = [
    "tzdata>=2024.1",
]

[project.scripts]
novastack = "novastack_orders.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstrument>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novastack_orders"]

[tool.uv]
# Students install the latest uv; this stops a very old one giving confusing errors.
required-version = ">=0.11"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Set-up and checker scripts print long, friendly messages.
"tools/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["novastack_orders"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
markers = [
    "smoke: fast, critical-path tests run on every push",
    "integration: slower tests that touch SQLite or run a whole checkout",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["novastack_orders"]
branch = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["novastack_orders"]
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
# Pricing is the most money-sensitive code: it must be fully typed.
module = "novastack_orders.pricing.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
